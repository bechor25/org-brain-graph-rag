services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:2026.06.0}
    container_name: brain-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-brainpass}
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # The same MCP server `.mcp.json` launches over stdio, on streamable HTTP instead — for a
  # client that is not Claude Code, and for `curl http://127.0.0.1:8765/mcp`.
  #
  # No image and no Dockerfile on purpose. The repo is bind-mounted and `uv run` builds the
  # environment inside the container, so there is nothing to rebuild when the code changes
  # and no second definition of the dependencies to drift from `pyproject.toml`.
  # `UV_PROJECT_ENVIRONMENT` points that build at `/opt/venv`: without it `uv` would write a
  # Linux `.venv` over the macOS one the host is using.
  #
  # Profiles keep it out of `make up`: Neo4j is needed by every step, the MCP server only by
  # a client that wants HTTP. Start it with `docker compose --profile mcp up -d --wait`.
  brain-mcp:
    image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    container_name: brain-mcp
    profiles: ["mcp"]
    working_dir: /app
    command: ["uv", "run", "brain", "serve", "--http", "--host", "0.0.0.0", "--port", "8765"]
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_LINK_MODE: copy
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-brainpass}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      # Ollama runs on the host, not in compose: the model is 2.2 GB and pulling it into a
      # container for every `up` is a download nobody asked for.
      OLLAMA_URL: ${OLLAMA_URL_IN_DOCKER:-http://host.docker.internal:11434}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      EMBED_DIM: ${EMBED_DIM:-1024}
    volumes:
      - .:/app
      - mcp_venv:/opt/venv
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      # `/healthz` answers as soon as the server is listening and before Neo4j is touched:
      # "the server is up" and "the graph is loaded" are two different facts, and a
      # healthcheck that conflates them reports a corpus problem as a container problem.
      # This image has Python and neither curl nor wget.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=3).status==200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      # The first start builds the environment from `uv.lock` inside the container.
      start_period: 180s
      retries: 10

volumes:
  neo4j_data:
  neo4j_logs:
  mcp_venv:
